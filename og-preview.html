<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', 'Arial Black', sans-serif;
  }

  .og {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #2a1810 0%, #1a2639 45%, #0f172a 100%);
    display: flex;
    align-items: center;
    padding: 0 60px;
    box-sizing: border-box;
    position: relative;
    gap: 50px;
  }

  /* Иконка — уменьшили с 380 до 320 */
  .og-icon {
    width: 380px;
    height: 380px;
    flex-shrink: 0;
  }
  .og-icon img {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
  }

  .og-text {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 16px;
    min-width: 0;
  }

  /* Заголовок: обводка через двойной слой */
  .og-title {
    position: relative;
    font-size: 68px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1.5px;
    white-space: nowrap;
    margin: 0;
    padding: 0;
  }
  .og-title::before {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    color: #0f1419;
    -webkit-text-stroke: 12px #0f1419;
    paint-order: stroke fill;
    z-index: 0;
    letter-spacing: inherit;
  }
  .og-title span {
    position: relative;
    z-index: 1;
    color: #ffffff;
  }

  /* Подзаголовок */
  .og-sub {
    font-size: 24px;
    font-weight: 500;
    color: #b8c5d6;
    margin: 0;
    line-height: 1.3;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  /* Теги — компактнее */
  .og-tags {
    display: flex;
    flex-wrap: nowrap;
    gap: 10px;
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
  }
  .og-tags span {
    padding: 8px 20px;
    border-radius: 30px;
    background: rgba(255,205,0,0.12);
    color: #ffcd00;
    border: 1px solid rgba(255,205,0,0.35);
    line-height: 1;
    white-space: nowrap;
  }

  .og-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #ffcd00 0%, #e6b800 100%);
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og-icon">
      <img src="favicon.svg" alt="">
    </div>
    <div class="og-text">
      <h1 class="og-title" data-text="Caps Game Tools"><span>Caps Game Tools</span></h1>
      <p class="og-sub">Инструменты сообщества для игры Caps Game</p>
      <div class="og-tags">
        <span>Цены</span>
        <span>Стейкинг</span>
        <span>Галерея</span>
        <span>Рекрутер</span>
        <span>Финдер</span>
      </div>
    </div>
    <div class="og-bar"></div>
  </div>
</body>
</html>
