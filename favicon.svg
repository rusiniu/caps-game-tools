<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- 1. Радиальный градиент для фона -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="70%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </radialGradient>

    <!-- 2. Градиент для лучей -->
    <linearGradient id="rayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA000" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.4" />
    </linearGradient>

    <!-- 3. Фильтр тени -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>

    <!-- 4. Пути для дугового текста (асимметричные радиусы для оптического выравнивания) -->
	<!-- Верхняя дуга: радиус 195 (ближе к пунктиру) -->
	<path id="topArc" d="M 55, 250 A 195, 195 0 0, 1 445, 250" fill="none" />
	<!-- Нижняя дуга: радиус 205 (чуть дальше от центра, чтобы текст был ближе к пунктиру) -->
	<path id="bottomArc" d="M 45, 250 A 205, 205 0 0, 0 455, 250" fill="none" />
  </defs>

  <!-- ========================================== -->
  <!-- СЛОЙ 1: ФОН                               -->
  <!-- ========================================== -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGradient)" />

  <!-- ========================================== -->
  <!-- СЛОЙ 2: ЛУЧИ                              -->
  <!-- ========================================== -->
  <g fill="url(#rayGradient)">
    <g id="ray">
      <polygon points="250,250 242,10 258,10" />
    </g>
    <use href="#ray" transform="rotate(15 250 250)" />
    <use href="#ray" transform="rotate(30 250 250)" />
    <use href="#ray" transform="rotate(45 250 250)" />
    <use href="#ray" transform="rotate(60 250 250)" />
    <use href="#ray" transform="rotate(75 250 250)" />
    <use href="#ray" transform="rotate(90 250 250)" />
    <use href="#ray" transform="rotate(105 250 250)" />
    <use href="#ray" transform="rotate(120 250 250)" />
    <use href="#ray" transform="rotate(135 250 250)" />
    <use href="#ray" transform="rotate(150 250 250)" />
    <use href="#ray" transform="rotate(165 250 250)" />
    <use href="#ray" transform="rotate(180 250 250)" />
    <use href="#ray" transform="rotate(195 250 250)" />
    <use href="#ray" transform="rotate(210 250 250)" />
    <use href="#ray" transform="rotate(225 250 250)" />
    <use href="#ray" transform="rotate(240 250 250)" />
    <use href="#ray" transform="rotate(255 250 250)" />
    <use href="#ray" transform="rotate(270 250 250)" />
    <use href="#ray" transform="rotate(285 250 250)" />
    <use href="#ray" transform="rotate(300 250 250)" />
    <use href="#ray" transform="rotate(315 250 250)" />
    <use href="#ray" transform="rotate(330 250 250)" />
    <use href="#ray" transform="rotate(345 250 250)" />
  </g>

  <!-- ========================================== -->
  <!-- СЛОЙ 3: РАМКА И ПУНКТИР                   -->
  <!-- ========================================== -->
  <circle cx="250" cy="250" r="240" fill="none" stroke="#E65100" stroke-width="6"/>
  <circle cx="250" cy="250" r="220" fill="none" stroke="#D84315" stroke-width="4" stroke-dasharray="10, 8" opacity="0.7"/>

  <!-- ========================================== -->
  <!-- СЛОЙ 4: КРАСНЫЙ МАЗОК ПОД ТЕКСТ (вместо кляксы) -->
  <!-- ========================================== -->
  <!-- Это не круг, а динамичная форма, напоминающая мазок кистью -->
  <g fill="#F44336" filter="url(#shadow)">
    <!-- Основной мазок (вытянутый, с рваными краями) -->
    <!-- Основное тело — неровная форма с несколькими лепестками -->
    <path d="
      M175,250
      C160,225 180,195 210,190
      C220,165 255,155 275,170
      C295,150 330,165 330,195
      C360,205 375,235 355,260
      C375,285 355,315 320,315
      C315,345 285,360 255,345
      C230,365 195,355 190,325
      C155,320 145,285 165,265
      C150,255 155,240 175,250 Z"/>

    <!-- Крупная капля справа-сверху (оторвалась) -->
    <ellipse cx="382" cy="195" rx="22" ry="16"
             transform="rotate(-25 382 195)"/>

    <!-- Капля слева-снизу -->
    <ellipse cx="130" cy="330" rx="18" ry="13"
             transform="rotate(30 130 330)"/>

    <!-- Средняя капля сверху -->
    <ellipse cx="230" cy="130" rx="14" ry="10"
             transform="rotate(-15 230 130)"/>

    <!-- Капля справа-снизу -->
    <ellipse cx="360" cy="360" rx="16" ry="11"
             transform="rotate(40 360 360)"/>

    <!-- Мелкие брызги-точки -->
    <circle cx="415" cy="240" r="6"/>
    <circle cx="410" cy="285" r="4"/>
    <circle cx="102" cy="255" r="5"/>
    <circle cx="98" cy="220" r="3.5"/>
    <circle cx="290" cy="110" r="4.5"/>
    <circle cx="180" cy="118" r="3"/>
    <circle cx="395" cy="325" r="4"/>
    <circle cx="120" cy="372" r="4.5"/>
    <circle cx="350" cy="115" r="3.5"/>
    <circle cx="165" cy="390" r="3"/>
  </g>

  <!-- ========================================== -->
  <!-- СЛОЙ 5: ТЕКСТ                             -->
  <!-- ========================================== -->
  <g transform="translate(250, 250)">
    <!-- Черная обводка -->
    <text x="0" y="-20" text-anchor="middle" dominant-baseline="middle" 
          font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="60" 
          fill="none" stroke="#000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      Caps Game
    </text>
    <text x="0" y="50" text-anchor="middle" dominant-baseline="middle" 
          font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="60" 
          fill="none" stroke="#000" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      Tools
    </text>

    <!-- Белая заливка -->
    <text x="0" y="-20" text-anchor="middle" dominant-baseline="middle" 
          font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="60" 
          fill="#FFFFFF">
      Caps Game
    </text>
    <text x="0" y="50" text-anchor="middle" dominant-baseline="middle" 
          font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="60" 
          fill="#FFFFFF">
      Tools
    </text>
  </g>

  <!-- ========================================== -->
  <!-- СЛОЙ 6: ДУГОВОЙ ТЕКСТ (ЖИРНЕЕ И БЛИЖЕ К КРАЮ) -->
  <!-- ========================================== -->
  <text font-family="Arial, sans-serif" font-weight="900" font-size="19" fill="#D32F2F" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      AUTHENTIC
    </textPath>
  </text>

  <text font-family="Arial, sans-serif" font-weight="900" font-size="19" fill="#D32F2F" letter-spacing="2">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      FAN MADE
    </textPath>
  </text>

</svg>