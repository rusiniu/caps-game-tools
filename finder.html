<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Caps Finder — Поиск фишек по номеру</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Caps Game Tools">
    <meta property="og:title" content="Caps Finder — Поиск фишек по номеру">
    <meta property="og:description" content="Поиск фишек Caps по номеру — статус, владелец, коллекция, редкость.">
    <meta property="og:image" content="og-preview.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Caps Finder — Поиск фишек по номеру">
    <meta name="twitter:description" content="Поиск фишек Caps по номеру — статус, владелец, коллекция, редкость.">
    <meta name="twitter:image" content="og-preview.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* ===== Поиск ===== */
        .finder-search {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 1.5rem 1.8rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
            max-width: 720px;
            margin-left: auto;
            margin-right: auto;
        }

        .finder-search label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .finder-search-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .finder-search-row .input-modern {
            flex: 1;
            min-width: 160px;
            font-size: 1.05rem;
            padding: 12px 20px;
        }

        .finder-search-hint {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 10px;
        }

        /* ===== Результат ===== */
        .result-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            color: var(--text);
        }

        .result-header {
            background: linear-gradient(105deg, var(--bg-header) 0%, var(--bg-header-2) 100%);
            color: white;
            padding: 1.1rem 1.8rem;
            border-bottom: 3px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .result-header h4 {
            margin: 0;
            font-weight: 800;
            font-size: 1.15rem;
            color: #fff;
        }

        .result-header-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .result-header .stat-badge {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 0.3rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .result-body {
            padding: 1.5rem 1.8rem;
        }

        /* ===== Карточка фишки ===== */
        .chip-card {
            background: var(--bg-card);
            border-radius: 1.2rem;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid var(--border);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            position: relative;
            color: var(--text);
        }

        .chip-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--border-strong);
        }

        .chip-image-wrapper {
            flex: 1;
            background: linear-gradient(135deg, var(--bg-header) 0%, var(--bg-header-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            min-height: 120px;
            position: relative;
            overflow: hidden;
        }

        .chip-image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }

        .chip-card:hover .chip-image-wrapper img {
            transform: scale(1.05);
        }

        .chip-status-icon {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255,255,255,0.15);
        }

        .chip-grade-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .chip-info {
            padding: 0.6rem 0.8rem 0.8rem;
            background: var(--bg-card);
            flex-shrink: 0;
        }

        .chip-collection {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .chip-owner {
            font-size: 0.65rem;
            color: var(--text);
            background: rgba(255,255,255,0.06);
            padding: 1px 8px;
            border-radius: 30px;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            border: 1px solid var(--border);
        }

        .chip-id {
            font-size: 0.6rem;
            color: var(--text-dim);
            font-family: 'Inter', monospace;
        }

        .chip-status-label {
            font-size: 0.62rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .chip-nft-badge {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 30px;
            background: var(--info-bg);
            color: var(--info);
            margin-left: 4px;
        }

        /* ===== Пустое состояние и ошибки ===== */
        .finder-empty,
        .finder-error {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--border-radius);
            padding: 3rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            box-shadow: var(--shadow);
        }

        .finder-empty i,
        .finder-error i {
            font-size: 2.5rem;
            color: var(--text-dim);
            display: block;
            margin-bottom: 1rem;
        }

        .finder-error {
            border-color: rgba(255, 71, 64, 0.3);
            color: var(--danger);
        }

        .finder-error i {
            color: var(--danger);
        }

        /* ===== Заголовок группы статусов ===== */
        .status-group {
            margin-bottom: 2rem;
        }

        .status-group:last-child {
            margin-bottom: 0;
        }

        .status-group-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .status-group-emoji {
            font-size: 1.4rem;
            line-height: 1;
        }

        .status-group-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text);
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }

        .status-group-count {
            background: rgba(255,255,255,0.08);
            padding: 1px 10px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text);
            border: 1px solid var(--border);
        }

        /* ===== Мобильная адаптация ===== */
        @media (max-width: 768px) {
            .result-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .result-body {
                padding: 1rem;
            }
            .finder-search {
                padding: 1.2rem 1.2rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="site-header">
        <h1><i class="bi bi-search"></i> Caps Finder</h1>
        <p>Поиск фишек по номеру — статус, владелец, коллекция</p>
        <div class="site-nav">
            <a href="index.html" class="nav-link-custom"><i class="bi bi-house"></i> Портал</a>
            <a href="market.html" class="nav-link-custom"><i class="bi bi-graph-up"></i> Минимальные цены</a>
            <a href="staking.html" class="nav-link-custom"><i class="bi bi-thermometer-half"></i> Стейкинг</a>
            <a href="collections.html" class="nav-link-custom"><i class="bi bi-images"></i> Галерея</a>
            <a href="recruiter.html" class="nav-link-custom"><i class="bi bi-person-badge"></i> Рекрутер</a>
            <a href="finder.html" class="nav-link-custom active"><i class="bi bi-search"></i> Финдер</a>
        </div>
    </div>

    <!-- Поиск -->
    <div class="finder-search">
        <label><i class="bi bi-hash"></i> Номер фишки</label>
        <div class="finder-search-row">
            <input type="number" id="capNumberInput" class="input-modern" placeholder="Например, 2755" value="2755" inputmode="numeric">
            <button id="searchBtn" class="btn-gold" style="padding: 12px 28px; font-size: 0.95rem;">
                <i class="bi bi-search"></i> Найти
            </button>
        </div>
        <div class="finder-search-hint">
            Введите номер фишки — данные из открытого API игры
        </div>
    </div>

    <div id="resultContainer">
        <!-- Скелетон загрузки -->
        <div id="loadingSkeleton" style="display: none;">
            <div class="result-card">
                <div class="result-header">
                    <div class="skeleton" style="width: 40%; height: 24px;"></div>
                    <div class="skeleton" style="width: 30%; height: 20px;"></div>
                </div>
                <div class="result-body">
                    <div class="skeleton mb-3" style="height: 18px; width: 60%; margin-bottom: 1rem;"></div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                        <div class="skeleton" style="aspect-ratio:1/1;"></div>
                        <div class="skeleton" style="aspect-ratio:1/1;"></div>
                        <div class="skeleton" style="aspect-ratio:1/1;"></div>
                        <div class="skeleton" style="aspect-ratio:1/1;"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="cardsContent"></div>
    </div>

    <div class="site-footer">
        <i class="bi bi-cloud-check"></i> Данные из игры CapsGame (Firestore)
    </div>
</div>

<script src="js/common.js"></script>
<script>
(function() {
    const {
        getFieldValue,
        buildImageUrl,
        escapeHtml,
        getStatusInfo,
        getGradeInfo,
        searchCapsByNumber
    } = window.CapsTools;

    // ---------- Карточка фишки ----------
    function renderChipCard(item) {
        const fields = item.document?.fields || {};
        const id = getFieldValue(fields, 'id', '—');
        const collectionId = getFieldValue(fields, 'collectionId', 'unknown');
        const collection = getFieldValue(fields, 'collection', collectionId);
        const grade = getFieldValue(fields, 'grade', 'COMMON');
        const status = getFieldValue(fields, 'status', 'UNKNOWN');
        const owner = getFieldValue(fields, 'owner', null);
        const url = getFieldValue(fields, 'url', null);
        const isNft = getFieldValue(fields, 'isNft', false);

        // Имя владельца из истории
        let ownerName = null;
        if (fields.history?.arrayValue?.values?.length > 0) {
            const lastHistory = fields.history.arrayValue.values[0];
            const newOwner = lastHistory?.mapValue?.fields?.newOwner?.mapValue?.fields;
            if (newOwner) {
                const username = newOwner.username?.stringValue;
                const firstName = newOwner.first_name?.stringValue || '';
                const lastName = newOwner.last_name?.stringValue || '';
                if (username) {
                    ownerName = `${firstName} ${lastName}`.trim() || username;
                }
            }
        }

        const imageUrl = url ? buildImageUrl(url) : null;
        const displayOwner = ownerName || owner || 'Нет владельца';
        const isOwnerEmpty = !owner || owner === '';
        const statusInfo = getStatusInfo(status);
        const gradeInfo = getGradeInfo(grade);

        return `
            <div class="chip-card">
                <div class="chip-image-wrapper">
                    ${imageUrl
                        ? `<img src="${imageUrl}" alt="Chip #${escapeHtml(String(id))}" loading="lazy" onerror="this.style.display='none'">`
                        : '<i class="bi bi-image" style="font-size: 3rem; opacity: 0.3; color: #5f6d80;"></i>'
                    }
                    <div class="chip-status-icon" style="border-color: ${statusInfo.color}80;">
                        ${statusInfo.emoji}
                    </div>
                    <div class="chip-grade-badge" style="background: ${gradeInfo.color}cc;">
                        ${escapeHtml(gradeInfo.label)}
                    </div>
                </div>
                <div class="chip-info">
                    <div class="chip-collection">
                        <i class="bi bi-folder"></i> ${escapeHtml(collection)}
                        ${isNft ? '<span class="chip-nft-badge"><i class="bi bi-link-45deg"></i> NFT</span>' : ''}
                    </div>
                    <div style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
                        <i class="bi bi-person" style="font-size: 0.62rem; color: var(--text-dim);"></i>
                        <span class="chip-owner" title="${escapeHtml(displayOwner)}">
                            ${isOwnerEmpty ? '—' : escapeHtml(displayOwner)}
                        </span>
                    </div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span class="chip-status-label">
                            <span style="color: ${statusInfo.color};">●</span> ${escapeHtml(statusInfo.label)}
                        </span>
                        <span class="chip-id">
                            <i class="bi bi-hash"></i> ${escapeHtml(String(id))}
                        </span>
                    </div>
                </div>
            </div>
        `;
    }

    // ---------- Результат целиком ----------
    function renderCaps(caps, searchNumber) {
        if (!caps || caps.length === 0) {
            return `
                <div class="finder-empty">
                    <i class="bi bi-inbox"></i>
                    <h4 style="color: var(--text); margin-bottom: 0.5rem;">Ничего не найдено</h4>
                    <p>Фишек с номером <strong style="color: var(--accent);">#${escapeHtml(String(searchNumber))}</strong> не обнаружено</p>
                </div>
            `;
        }

        // Группировка по статусу
        const grouped = {};
        caps.forEach(item => {
            const fields = item.document?.fields || {};
            const status = getFieldValue(fields, 'status', 'UNKNOWN');
            if (!grouped[status]) grouped[status] = [];
            grouped[status].push(item);
        });

        const statusOrder = ['SALE', 'READY', 'STAKED', 'WITHDRAWN', 'LOCKED', 'BANNED', 'NFT_EDITING', 'BURNED'];
        const sortedStatuses = Object.keys(grouped).sort((a, b) => {
            const indexA = statusOrder.indexOf(a);
            const indexB = statusOrder.indexOf(b);
            if (indexA === -1 && indexB === -1) return a.localeCompare(b);
            if (indexA === -1) return 1;
            if (indexB === -1) return -1;
            return indexA - indexB;
        });

        let html = `
            <div class="result-card">
                <div class="result-header">
                    <h4><i class="bi bi-tag"></i> Фишки #${escapeHtml(String(searchNumber))}</h4>
                    <div class="result-header-badges">
                        <span class="stat-badge"><i class="bi bi-database"></i> Всего: ${caps.length}</span>
                        ${sortedStatuses.map(s => {
                            const count = grouped[s].length;
                            const info = getStatusInfo(s);
                            return `<span class="stat-badge">${info.emoji} ${escapeHtml(info.label)}: ${count}</span>`;
                        }).join('')}
                    </div>
                </div>
                <div class="result-body">
        `;

        sortedStatuses.forEach(status => {
            const items = grouped[status];
            const info = getStatusInfo(status);

            html += `
                <div class="status-group">
                    <div class="status-group-header">
                        <span class="status-group-emoji">${info.emoji}</span>
                        <h5 class="status-group-title" style="border-left-color: ${info.color};">
                            ${escapeHtml(info.label)}
                            <span class="status-group-count">${items.length}</span>
                        </h5>
                    </div>
                    <div class="chip-grid">
                        ${items.map(item => renderChipCard(item)).join('')}
                    </div>
                </div>
            `;
        });

        html += `
                </div>
            </div>
        `;
        return html;
    }

    // ---------- Поиск ----------
    async function searchCaps(number) {
        const loadingDiv = document.getElementById('loadingSkeleton');
        const contentDiv = document.getElementById('cardsContent');

        loadingDiv.style.display = 'block';
        contentDiv.innerHTML = '';

        try {
            const data = await searchCapsByNumber(number);
            contentDiv.innerHTML = renderCaps(data, number);
        } catch (err) {
            contentDiv.innerHTML = `
                <div class="finder-error">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <strong>Ошибка:</strong> ${escapeHtml(err.message)}<br>
                    <small style="color: var(--text-muted);">Проверьте номер, интернет, или возможно требуется CORS</small>
                </div>
            `;
        } finally {
            loadingDiv.style.display = 'none';
        }
    }

    // ---------- Обработчики ----------
    document.getElementById('searchBtn').addEventListener('click', () => {
        const number = document.getElementById('capNumberInput').value.trim();
        if (!number || isNaN(number) || parseInt(number) <= 0) {
            alert('Введите корректный номер фишки (положительное число)');
            return;
        }
        searchCaps(parseInt(number));
    });

    document.getElementById('capNumberInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            document.getElementById('searchBtn').click();
        }
    });

    // ---------- Загрузка при старте ----------
    window.addEventListener('DOMContentLoaded', () => {
        searchCaps(2755);
    });
})();
</script>
</body>
</html>
